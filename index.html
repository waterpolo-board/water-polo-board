<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e2c35">
  <title>לוח כדורמים</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>לוח כדורמים</h1>
    <nav class="toolbar" aria-label="כלים">
      <div class="group" role="group" aria-label="מצב">
        <button data-mode="full" aria-pressed="true">בריכה מלאה</button>
        <button data-mode="6v6" aria-pressed="false">6 על 6</button>
        <button data-mode="6v5" aria-pressed="false">6 על 5</button>
      </div>
      <div class="group" role="group" aria-label="כלי ציור">
        <button data-tool="move" aria-pressed="true">הזזה</button>
        <button data-tool="arrow" aria-pressed="false">חץ תנועה</button>
        <button data-tool="pass" aria-pressed="false">מסירה</button>
      </div>
      <div class="group plain">
        <button id="undo">בטל</button>
        <button id="clear">נקה ציורים</button>
        <button id="reset">איפוס מערך</button>
      </div>
    </nav>
  </header>

  <main>
    <svg id="board" aria-label="בריכת כדורמים">
      <defs>
        <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
          <path d="M0,1 L9,5 L0,9 z" fill="currentColor"/>
        </marker>
      </defs>
      <g id="pool"></g>
      <g id="drawings"></g>
      <g id="pieces"></g>
    </svg>
  </main>

  <script src="app.js"></script>
</body>
</html>
