<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>לוח טקטי כדורמים</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>לוח טקטי כדורמים</h1>
    <div class="toolbar">
      <button data-mode="move" class="active" title="הזזת שחקנים וכדור">✋ הזזה</button>
      <button data-mode="arrow" title="ציור חץ תנועה">➜ חץ</button>
      <button data-mode="pass" title="ציור קו מסירה">⋯ מסירה</button>
      <span class="sep"></span>
      <button id="undo" title="ביטול ציור אחרון">↶ בטל</button>
      <button id="clear" title="מחיקת כל הציורים">🧹 נקה ציורים</button>
      <button id="reset" title="החזרת השחקנים למיקום פתיחה">⟲ איפוס</button>
    </div>
  </header>

  <main>
    <svg id="board" viewBox="0 0 300 200" aria-label="בריכת כדורמים">
      <defs>
        <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>
      <g id="pool"></g>
      <g id="drawings"></g>
      <g id="pieces"></g>
    </svg>
  </main>

  <script src="app.js"></script>
</body>
</html>
